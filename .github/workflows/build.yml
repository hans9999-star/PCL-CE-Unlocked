name: Build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - '**/.gitignore'
      - '**/.editorconfig'
      - '**/LICENSE'
      - '**/LICENCE'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # 必须 >= 10.0.400：项目引用的 Microsoft.CodeAnalysis.CSharp 5.6.0
          # 需要 Roslyn 5.6+，10.0.100 自带 Roslyn 5.0 会导致源生成器加载失败
          dotnet-version: '10.0.402'

      - name: Restore
        run: dotnet restore "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" -p:Platform=x64

      - name: Build
        run: >
          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj"
          -c Release -p:Platform=x64 -p:DeleteExistingFiles=true
          -o ./artifact --self-contained

      - name: Prepare artifact
        shell: pwsh
        run: |
          $exe = "artifact/Plain Craft Launcher 2.exe"
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "产物大小: $size MB"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $exe "release/PCL-CE-Unlocked.exe"

      # 用仓库 Secrets 里的自签名证书给 exe 签名
      - name: Sign executable
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) {
            Write-Host "未配置签名证书，跳过签名"
            exit 0
          }
          $pfx = "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))

          # 找到 signtool（Windows runner 自带 Windows Kits）
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "未找到 signtool.exe" }
          Write-Host "signtool: $signtool"

          & $signtool sign /f $pfx /p $env:PFX_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 /v "release/PCL-CE-Unlocked.exe"
          if ($LASTEXITCODE -ne 0) { throw "签名失败，退出码 $LASTEXITCODE" }

          Remove-Item $pfx -Force
          Write-Host "签名完成"

      - name: Verify signature
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) {
            Write-Host "未配置签名证书，跳过校验"
            exit 0
          }
          # 自签名证书的根不在 runner 的信任库里，先把它装进当前用户的 Root
          # （仅影响本次 runner，用完即弃），否则 Get-AuthenticodeSignature 会报
          # "certificate chain terminated in a root certificate which is not trusted"。
          $pfx = "verify.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
            (Resolve-Path $pfx).Path, $env:PFX_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
          $rootStore = New-Object System.Security.Cryptography.X509Certificates.X509Store('Root','CurrentUser')
          $rootStore.Open('ReadWrite')
          $rootStore.Add($cert)
          $rootStore.Close()
          Remove-Item $pfx -Force

          $sig = Get-AuthenticodeSignature "release/PCL-CE-Unlocked.exe"
          Write-Host "签名状态: $($sig.Status)"
          Write-Host "签名者:   $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "签名校验失败：$($sig.StatusMessage)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCL-CE-Unlocked-win-x64
          path: release/PCL-CE-Unlocked.exe

      # 只有打 tag 时才创建 Release，启动器的更新检查读取的就是这里
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release/PCL-CE-Unlocked.exe
          generate_release_notes: true
          draft: false
          prerelease: false
